# cargo-deny configuration. See CONTRIBUTING.md, "Dependencies".

[advisories]
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # The root certificates used by the HTTP client's TLS stack.
    "CDLA-Permissive-2.0",
    # MIT without the attribution clause; `borrow-or-share`, pulled in by the
    # `jsonschema` dev-dependency.
    "MIT-0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
