name: A variable from the command line reaches the case it runs
steps:
  - cli.run:
      command: ${da}
      args: [run, tests/self/fixtures/vars.case, --no-bundle, --var, "da=${da}", --var, target=tests/self/fixtures/passing.case]
    expect:
      - path: $.exit_code
        equals: 0
      - path: $.stdout
        contains: "PASS"
