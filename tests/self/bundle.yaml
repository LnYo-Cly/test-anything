name: A failing case leaves a failure bundle another run can use
vars:
  # Overridden by the test driver, which needs a directory it can inspect.
  bundles: .da/failures
steps:
  - cli.run:
      command: ${da}
      args: [--output, json, run, tests/self/fixtures/failing.case, --bundle-dir, "${bundles}", --var, "da=${da}"]
    expect:
      - path: $.exit_code
        equals: 1
      - path: $.json.cases[0].bundle
        exists: true
    save:
      bundle: $.json.cases[0].bundle
  - cli.run:
      command: ${da}
      args: [run, "${bundle}", --no-bundle, --var, "da=${da}"]
    expect:
      - path: $.exit_code
        equals: 1
      - path: $.stdout
        contains: "FAIL"
