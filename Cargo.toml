[package]
name = "test-anything"
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[[bin]]
name = "ta"
path = "src/main.rs"

[features]
default = ["http", "cli", "log", "db"]
# The `http.request` step and the HTTP client it needs.
http = ["dep:schemars", "dep:ureq"]
# The `cli.run` step and the child-process timeout it needs.
cli = ["dep:schemars", "dep:wait-timeout"]
# The `log.file` observer and the argument schema it needs.
log = ["dep:schemars"]
# The `db.query` step and the two database clients it needs.
db = [
    "dep:schemars",
    "dep:rusqlite",
    "dep:postgres",
    "dep:tokio-postgres-rustls",
    "dep:rustls",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
jsonpath-rust = "1.0"
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize"] }
serde_json = "1"
schemars = { version = "1.2", optional = true }
ureq = { version = "3.5", default-features = false, features = ["json", "rustls"], optional = true }
wait-timeout = { version = "0.2", optional = true }
# `bundled` compiles the SQLite C sources, so no system library is needed and
# the read-only open flag is always available.
rusqlite = { version = "0.42", features = ["bundled"], optional = true }
postgres = { version = "0.19", features = ["with-serde_json-1"], optional = true }
tokio-postgres-rustls = { version = "0.14", features = ["ring", "webpki-roots"], optional = true }
# Only to install the crypto provider `tokio-postgres-rustls` asks for; this is
# the same crate and version `ureq` already builds with.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# The print macros panic when standard output or standard error cannot be
# written, for example when the reader closes the pipe early. Write through
# fallible helpers so the run keeps its own exit code.
print_stdout = "deny"
print_stderr = "deny"

[dev-dependencies]
jsonschema = { version = "0.61", default-features = false }
